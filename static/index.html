<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>heiss</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem 1rem;
        }

        #app {
            width: 100%;
            max-width: 700px;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .tab {
            padding: 0.35rem 1rem;
            border: 1px solid #2a2a2a;
            border-radius: 0.5rem;
            background: transparent;
            color: #666;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            transition: border-color 0.2s, color 0.2s;
        }

        .tab.active {
            border-color: #555;
            color: #e0e0e0;
        }

        .tab:hover {
            border-color: #444;
            color: #bbb;
        }

        .window-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .win {
            padding: 0.25rem 0.75rem;
            border: 1px solid #2a2a2a;
            border-radius: 0.4rem;
            background: transparent;
            color: #666;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
            transition: border-color 0.2s, color 0.2s;
        }

        .win.active {
            border-color: #555;
            color: #e0e0e0;
        }

        .win:hover {
            border-color: #444;
            color: #bbb;
        }

        .container {
            display: flex;
            gap: 1rem;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            text-align: center;
            flex: 1;
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: #444;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .value {
            font-size: 2.5rem;
            font-weight: 200;
            line-height: 1;
        }

        .unit {
            font-size: 1rem;
            color: #666;
            margin-left: 0.1em;
        }

        .sensor {
            margin-bottom: 1.5rem;
        }

        .sensor-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .timestamp {
            margin-top: 0.4rem;
            font-size: 0.7rem;
            color: #555;
            text-align: center;
        }

        .history-img {
            width: 100%;
            display: block;
            border-radius: 0.5rem;
        }

        .error {
            color: #c44;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="tabs">
        <button class="tab active" onclick="showTab(this,'current')">Current</button>
        <button class="tab" onclick="showTab(this,'history')">History</button>
    </div>

    <div id="view-current">
        <div id="sensors"></div>
    </div>

    <div id="view-history" style="display:none">
        <div class="window-selector">
            <button class="win active" onclick="setWin(this,'day')">Day</button>
            <button class="win" onclick="setWin(this,'week')">Week</button>
            <button class="win" onclick="setWin(this,'month')">Month</button>
        </div>
        <div id="history-cards"></div>
    </div>
</div>

<script>

    const sensors = {
        "78:e3:6d:05:61:04": "Wohnen",
        "e0:5a:1b:77:f1:80": "Schlafen"
    }

    // --- Tab navigation ---

    function showTab(el, tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('view-current').style.display = tab === 'current' ? '' : 'none';
        document.getElementById('view-history').style.display = tab === 'history' ? '' : 'none';
        if (tab === 'history') renderHistory();
    }

    // --- History tab ---

    let activeWindow = 'day';

    function setWin(el, win) {
        activeWindow = win;
        document.querySelectorAll('.win').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        renderHistory();
    }

    function renderHistory() {
        const t = Math.floor(Date.now() / 60000);
        const el = document.getElementById('history-cards');
        el.innerHTML = '';
        for (const [id, name] of Object.entries(sensors)) {
            const section = document.createElement('div');
            section.className = 'sensor';
            section.innerHTML =
                '<div class="sensor-name">' + name + ' (' + id + ')</div>' +
                '<img class="history-img" ' +
                'src="/api/history.svg?device=' + encodeURIComponent(id) + '&window=' + activeWindow + '&_t=' + t + '" ' +
                'loading="lazy">';
            el.appendChild(section);
        }
    }

    // --- Current tab ---

    function render(data) {
        const latest = {};
        for (const row of data) {
            if (!latest[row.device_id]) {
                latest[row.device_id] = row;
            }
        }

        const el = document.getElementById("sensors");
        el.innerHTML = "";

        const ids = Object.keys(latest).sort();
        for (const id of ids) {
            const d = latest[id];
            const section = document.createElement("div");
            section.className = "sensor";
            section.innerHTML =
                '<div class="sensor-name">' + sensors[id] + " (" + id + ")" + '</div>' +
                '<div class="container">' +
                '<div class="card">' +
                '<div class="label">Temperature</div>' +
                '<div class="value">' + d.temp_c.toFixed(1) + '<span class="unit">&deg;C</span></div>' +
                '</div>' +
                '<div class="card">' +
                '<div class="label">Humidity</div>' +
                '<div class="value">' + d.rh_percent.toFixed(0) + '<span class="unit">%</span></div>' +
                '</div>' +
                '</div>' +
                '<div class="timestamp">' + new Date(d.ts).toLocaleString() + '</div>';
            el.appendChild(section);
        }
    }

    async function load() {
        try {
            const res = await fetch("/api/timeseries");
            if (!res.ok) {
                throw new Error(res.statusText)
            }
            render(await res.json());
        } catch (e) {
            document.getElementById("sensors").innerHTML =
                '<div class="error">' + e.message + '</div>';
        }
    }

    load();
    setInterval(load, 10_000);
</script>
</body>
</html>
