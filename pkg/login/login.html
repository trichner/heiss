<html>
<head>
    <meta charset="utf-8"/>
    <meta name="robots" content="noindex"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            box-sizing: border-box;
            height: 100%;
            width: 100%;
            margin: 0;
            position: absolute;
        }

        body {
            background-color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* big screens */
        @media only screen and (min-width: 570px) {

            #login-form {
                margin-left: auto;
                margin-right: auto;
                margin-top: 20vh;
                width: 30em;
                padding: 30px;
                border: 1px solid black;
                box-shadow: 0 0 10px 2px lightgray;
            }

            #login-form form {
                align-items: center;
                display: flex;
                margin: 0;
            }
            #login-form .button-login {
                margin-left: 5px;
            }
        }

        /* small screens */
        @media only screen and (max-width: 570px) {

            #login-form {
                margin: 20vh 10px 0 10px
            }

            #login-form .button-login {
                margin-top: 5px;
                width: 100%;
            }
        }

        #login-form {
            background-color: white;
        }

        #login-form form {
            margin: 0;
        }

        #login-form .input-name {
            width: 100%;
            padding: 12px 20px;
        }

        #login-form .button-login {
            padding: 12px 20px;
            border: black 1px solid;
            background-color: white;
        }

        #login-form .button-login:hover {
            background-color: lightgray;
        }

    </style>
</head>
<body>
<div id="login-form">
    <form action="/login" method="post">
        <input class="input-name" name="password" placeholder="Passwort">
        <input class="button-login" type="submit" value="Anmelden">
    </form>
</div>
</body>
</html>
