<html>
<head>
    <meta charset="utf-8"/>
    <meta name="robots" content="noindex"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            box-sizing: border-box;
            height: 100%;
            width: 100%;
            margin: 0;
            position: absolute;
        }

        body {
            background-color: #0f0f0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* big screens */
        @media only screen and (min-width: 570px) {

            #login-form {
                margin-left: auto;
                margin-right: auto;
                margin-top: 20vh;
                width: 30em;
                padding: 30px;
                border: 1px solid #2a2a2a;
                border-radius: 1rem;
                box-shadow: 0 0 20px 2px rgba(0, 0, 0, 0.6);
            }

            #login-form form {
                align-items: center;
                display: flex;
                margin: 0;
            }
            #login-form .button-login {
                margin-left: 5px;
            }
        }

        /* small screens */
        @media only screen and (max-width: 570px) {

            #login-form {
                margin: 20vh 10px 0 10px
            }

            #login-form .button-login {
                margin-top: 5px;
                width: 100%;
            }
        }

        #login-form {
            background-color: #1a1a1a;
        }

        #login-form form {
            margin: 0;
        }

        #login-form .input-name {
            width: 100%;
            padding: 12px 20px;
            background-color: #0f0f0f;
            color: #e0e0e0;
            border: 1px solid #2a2a2a;
            border-radius: 0.25rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #login-form .input-name:focus {
            border-color: #555;
        }

        #login-form .input-name::placeholder {
            color: #666;
        }

        #login-form .button-login {
            padding: 12px 20px;
            border: 1px solid #2a2a2a;
            border-radius: 0.25rem;
            background-color: #1a1a1a;
            color: #e0e0e0;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        #login-form .button-login:hover {
            background-color: #222;
            border-color: #444;
        }

    </style>
</head>
<body>
<div id="login-form">
    <form action="/login" method="post">
        <input class="input-name" name="password" placeholder="Passwort">
        <input class="button-login" type="submit" value="Anmelden">
    </form>
</div>
</body>
</html>
